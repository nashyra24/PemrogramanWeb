<!DOCTYPE html>
<!-- Deklarasi dokumen HTML5 -->
<html lang="id"> <!-- Bahasa halaman: Indonesia -->
<head>
    <meta charset="UTF-8"> <!-- Agar karakter khusus tampil benar -->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Responsif di HP -->
    <title>SITARIS HMTI | Tambah Peminjam</title> <!-- Judul di tab browser -->
    <link rel="stylesheet" href="../assets/css/style.css"> <!-- Menghubungkan file CSS -->
</head>
<body>
    <!-- ===== HEADER: judul aplikasi + menu ===== -->
    <header>
        <h1>SITARIS HMTI</h1>
        <!-- Tombol hamburger, dikendalikan app.js lewat id -->
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <!-- Menu navigasi ke semua halaman -->
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../barang/list.html">Daftar Barang</a></li>
                <li><a href="../barang/tambah.html">Tambah Barang</a></li>
                <li><a href="../peminjam/list.html">Daftar Peminjam</a></li>
                <li><a href="../peminjam/tambah.html">Tambah Peminjam</a></li>
            </ul>
        </nav>
    </header>

    <!-- ===== ISI UTAMA HALAMAN ===== -->
    <main>
        <section>
            <h2>Tambah Peminjam</h2>

            <!-- Form kirim data (POST) ke proses_tambah.php; id dipakai validasi app.js -->
            <form id="form-tambah" method="post" action="proses_tambah.php">
                <p>
                    <label for="nim">NIM</label><br>
                    <!-- name = nama data yang diterima PHP; required = wajib diisi -->
                    <input type="text" id="nim" name="nim" required>
                </p>
                <p>
                    <label for="nama">Nama</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="oki">Nama OKI</label><br>
                    <!-- Dropdown organisasi asal peminjam -->
                    <select id="oki" name="oki">
                        <option value="HMTK">HMTK</option>
                        <option value="HMA">HMA</option>
                        <option value="PL FM">PL FM</option>
                        <option value="BEM">BEM</option>
                    </select>
                </p>
                <p>
                    <label for="no_hp">No. HP</label><br>
                    <!-- Opsional (tanpa required) -->
                    <input type="text" id="no_hp" name="no_hp">
                </p>
                <p>
                    <!-- Tombol kirim form -->
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>&copy; 2026 SITARIS HMTI &mdash; Jobsheet 8</p>
    </footer>
    <!-- Memuat JavaScript (menu, pencarian, hapus, validasi) -->
    <script src="../assets/js/app.js"></script>
</body>
</html>
