<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Wajib untuk Bootstrap agar responsif di HP -->
    <title>SITARIS HMTI | Tambah Peminjam</title>

    <!-- 1) Bootstrap 5.3.3 CSS dari CDN (butuh internet) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 2) CSS buatan sendiri, hanya override warna brand. Harus DITULIS SETELAH Bootstrap agar menimpa warna bawaannya -->
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<!-- d-flex flex-column min-vh-100 = tinggi minimal 1 layar, supaya footer menempel di bawah -->
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- ===== NAVBAR =====
         navbar          : komponen menu atas
         navbar-expand-md: menu terbuka penuh di layar >= 768px, jadi hamburger di bawahnya
         data-bs-theme="dark": teks & tombol hamburger jadi terang (cara Bootstrap 5.3, pengganti navbar-dark)
         Warna latar navbar ditentukan di style.css (warna brand) -->
    <nav class="navbar navbar-expand-md" data-bs-theme="dark">
        <div class="container"> <!-- container = isi dibatasi lebar & diberi jarak kiri-kanan -->
            <a class="navbar-brand fw-bold" href="../index.html">SITARIS HMTI</a>

            <!-- Tombol hamburger (.navbar-toggler), tampil di layar < 768px.
                 data-bs-toggle="collapse" + data-bs-target="#menuUtama" = Bootstrap JS membuka-tutup menu
                 (menggantikan checkbox hack murni CSS) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuUtama" aria-controls="menuUtama"
                    aria-expanded="false" aria-label="Buka menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- collapse navbar-collapse = bagian menu yang bisa dilipat di HP (id sama dengan data-bs-target) -->
            <div class="collapse navbar-collapse" id="menuUtama">
                <!-- ms-auto = dorong menu ke kanan -->
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../barang/list.html">Daftar Barang</a></li>
                    <li class="nav-item"><a class="nav-link" href="../barang/tambah.html">Tambah Barang</a></li>
                    <li class="nav-item"><a class="nav-link" href="../peminjam/list.html">Daftar Peminjam</a></li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="../peminjam/tambah.html">Tambah Peminjam</a> <!-- active = menu halaman ini disorot -->
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ===== ISI UTAMA =====
         container = lebar terbatas dan di tengah; my-4 = jarak atas-bawah; flex-grow-1 = isi mengisi sisa tinggi layar -->
    <main class="container my-4 flex-grow-1">
        <div class="card shadow-sm" style="max-width: 560px;">
            <div class="card-body">
                <h2 class="h4 mb-4">Tambah Peminjam</h2>

                <!-- Form dikirim (POST) ke proses_tambah.php -->
                <form id="form-tambah" method="post" action="proses_tambah.php">
                    <div class="mb-3">
                        <label for="nim" class="form-label">NIM</label>
                        <input type="text" class="form-control" id="nim" name="nim" required> <!-- required = wajib diisi -->
                    </div>
                    <div class="mb-3">
                        <label for="nama" class="form-label">Nama</label>
                        <input type="text" class="form-control" id="nama" name="nama" required>
                    </div>
                    <div class="mb-3">
                        <label for="oki" class="form-label">Nama OKI</label>
                        <!-- form-select = gaya dropdown Bootstrap -->
                        <select class="form-select" id="oki" name="oki">
                            <option value="HMTK">HMTK</option>
                            <option value="HMA">HMA</option>
                            <option value="PL FM">PL FM</option>
                            <option value="BEM">BEM</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="no_hp" class="form-label">No. HP</label>
                        <input type="text" class="form-control" id="no_hp" name="no_hp"> <!-- Opsional (tanpa required) -->
                    </div>
                    <button type="submit" class="btn btn-primary">Simpan</button>
                </form>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER =====
         border-top = garis atas; py-3 = jarak atas-bawah; text-center = rata tengah; text-muted = teks abu-abu -->
    <footer class="border-top py-3 text-center text-muted bg-white">
        <small>&copy; 2026 SITARIS HMTI &mdash; Jobsheet 3</small>
    </footer>

    <!-- 3) Bootstrap JS bundle (sudah termasuk Popper). Dibutuhkan agar hamburger/collapse bekerja -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
