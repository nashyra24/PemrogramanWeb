<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Wajib untuk Bootstrap agar responsif di HP -->
    <title>SITARIS HMTI | Tambah Barang</title>

    <!-- 1) Bootstrap 5.3.3 CSS dari CDN (butuh internet) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 2) CSS buatan sendiri, hanya override warna brand. Harus DITULIS SETELAH Bootstrap agar menimpa warna bawaannya -->
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<!-- d-flex flex-column min-vh-100 = tinggi minimal 1 layar, supaya footer menempel di bawah -->
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- ===== NAVBAR =====
         navbar          : komponen menu atas
         navbar-expand-md: menu terbuka penuh di layar >= 768px, jadi hamburger di bawahnya
         data-bs-theme="dark": teks & tombol hamburger jadi terang (cara Bootstrap 5.3, pengganti navbar-dark)
         Warna latar navbar ditentukan di style.css (warna brand) -->
    <nav class="navbar navbar-expand-md" data-bs-theme="dark">
        <div class="container"> <!-- container = isi dibatasi lebar & diberi jarak kiri-kanan -->
            <a class="navbar-brand fw-bold" href="../index.html">SITARIS HMTI</a>

            <!-- Tombol hamburger (.navbar-toggler), tampil di layar < 768px.
                 data-bs-toggle="collapse" + data-bs-target="#menuUtama" = Bootstrap JS membuka-tutup menu
                 (menggantikan checkbox hack murni CSS) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuUtama" aria-controls="menuUtama"
                    aria-expanded="false" aria-label="Buka menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- collapse navbar-collapse = bagian menu yang bisa dilipat di HP (id sama dengan data-bs-target) -->
            <div class="collapse navbar-collapse" id="menuUtama">
                <!-- ms-auto = dorong menu ke kanan -->
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../barang/list.html">Daftar Barang</a></li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="../barang/tambah.html">Tambah Barang</a> <!-- active = menu halaman ini disorot -->
                    </li>
                    <li class="nav-item"><a class="nav-link" href="../peminjam/list.html">Daftar Peminjam</a></li>
                    <li class="nav-item"><a class="nav-link" href="../peminjam/tambah.html">Tambah Peminjam</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ===== ISI UTAMA =====
         container = lebar terbatas dan di tengah; my-4 = jarak atas-bawah; flex-grow-1 = isi mengisi sisa tinggi layar -->
    <main class="container my-4 flex-grow-1">
        <!-- Lebar kartu dibatasi (maxWidth) agar form tidak terlalu melebar di layar besar -->
        <div class="card shadow-sm" style="max-width: 560px;">
            <div class="card-body">
                <h2 class="h4 mb-4">Tambah Barang</h2>

                <!-- Form dikirim (POST) ke proses_tambah.php -->
                <form id="form-tambah" method="post" action="proses_tambah.php">
                    <!-- mb-3 = jarak bawah tiap isian; form-label = gaya label -->
                    <div class="mb-3">
                        <label for="nama_barang" class="form-label">Nama Barang</label>
                        <!-- form-control = gaya input teks Bootstrap; required = wajib diisi -->
                        <input type="text" class="form-control" id="nama_barang" name="nama_barang" required>
                    </div>
                    <div class="mb-3">
                        <label for="kategori" class="form-label">Kategori</label>
                        <!-- form-select = gaya dropdown Bootstrap -->
                        <select class="form-select" id="kategori" name="kategori">
                            <option value="elektronik">Elektronik</option>
                            <option value="furnitur">Furnitur</option>
                            <option value="alat-kebersihan">Alat Kebersihan</option>
                            <option value="lainnya">Lainnya</option>
                        </select>
                    </div>
                    <!-- row g-3 + col-md-6 = Kondisi dan Status berdampingan di layar >= 768px, bertumpuk di HP -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="kondisi" class="form-label">Kondisi</label>
                            <select class="form-select" id="kondisi" name="kondisi">
                                <option value="baik">Baik</option>
                                <option value="rusak">Rusak</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status">
                                <option value="tersedia">Tersedia</option>
                                <option value="dipinjam">Dipinjam</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="jumlah" class="form-label">Jumlah</label>
                        <!-- min="0" = tidak boleh negatif -->
                        <input type="number" class="form-control" id="jumlah" name="jumlah" min="0" required>
                    </div>
                    <!-- btn btn-primary = tombol biru utama -->
                    <button type="submit" class="btn btn-primary">Simpan</button>
                </form>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER =====
         border-top = garis atas; py-3 = jarak atas-bawah; text-center = rata tengah; text-muted = teks abu-abu -->
    <footer class="border-top py-3 text-center text-muted bg-white">
        <small>&copy; 2026 SITARIS HMTI &mdash; Jobsheet 3</small>
    </footer>

    <!-- 3) Bootstrap JS bundle (sudah termasuk Popper). Dibutuhkan agar hamburger/collapse bekerja -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
