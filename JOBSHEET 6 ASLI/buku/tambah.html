<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SITARIS HMTI | Tambah Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SITARIS HMTI</h1>
        <!-- Tombol hamburger ditambahkan -->
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Barang</a></li>
                <li><a href="tambah.html">Tambah Barang</a></li>
                <li><a href="../anggota/list.html">Daftar Peminjam</a></li>
                <li><a href="../anggota/tambah.html">Tambah Peminjam</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Buku</h2>
            <!-- Ditambahkan id="form-tambah" -->
            <form id="form-tambah" novalidate>
                <p> 
                    <label for="judul">Judul</label><br> 
                    <input type="text" id="judul" name="judul" required> 
                </p> 
                 
                <p> 
                    <label for="pengarang">Pengarang</label><br> 
                    <input type="text" id="pengarang" name="pengarang" required> 
                </p> 
             
                <p> 
                    <label for="tahun">Tahun Terbit</label><br> 
                    <input type="number" id="tahun" name="tahun" min="1900" max="2026" required> 
                </p> 
             
                <p> 
                    <label for="isbn">ISBN</label><br> 
                    <input type="text" id="isbn" name="isbn"> 
                </p> 
             
                <p> 
                    <label for="stok">Stok</label><br> 
                    <input type="number" id="stok" name="stok" min="0" required> 
                </p> 
             
                <p> 
                    <label for="kategori">Kategori</label><br> 
                    <select id="kategori" name="kategori"> 
                        <option value="fiksi">ATK</option> 
                        <option value="non-fiksi">SKKM</option> 
                        <option value="referensi">DEKOR</option> 
                    </select> 
                </p> 
                <p> 
                    <button type="submit">Simpan</button> 
                </p> 
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 SITARIS HMTI</p>
    </footer>

    <!-- Tag script JS -->
    <script src="../assets/js/app.js"></script>
</body>
</html>
